name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: economy-package
          path: '*.tgz'
  wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/prepare-sdk.mjs
      - run: npm --prefix wallet ci --ignore-scripts
      - run: npm --prefix wallet run check
      - run: npm --prefix wallet run dev:dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-artifact
          path: wallet/dist
